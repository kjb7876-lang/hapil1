name: RC121 Dream and connected lasers
on:
  workflow_dispatch:
  push:
    branches: [fix/rc121-connected-dream]
    paths:
      - '.github/workflows/rc121-dream-connected.yml'
      - 'tests/rc121-*.cjs'
      - 'tests/dream-death-dialog-browser.cjs'
      - 'tests/rc116-laser-telegraph-browser.cjs'
      - 'tools/patch-dream-death-dialog.cjs'
      - 'tools/repair-warning-fixture-loading.cjs'
      - 'assets/rc108/samong-ricochet.js'
      - 'assets/rc108/laser-topology.js'
      - 'assets/rc97/choice-patterns.js'
      - 'assets/index-v31526.js'
      - 'index.html'
permissions:
  contents: read
concurrency:
  group: rc121-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/rc121-connected-dream'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply bounded death-dialog candidate on work branch only
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/rc121-connected-dream
          test -z "$(git status --porcelain)"
          ART=$(git hash-object assets/rc77/connected-laser.js)
          node tools/patch-dream-death-dialog.cjs
          node tools/repair-warning-fixture-loading.cjs
          test "$(git hash-object assets/rc77/connected-laser.js)" = "$ART"
          for f in assets/index-v31526.js assets/rc108/samong-ricochet.js assets/rc108/laser-topology.js assets/rc97/choice-patterns.js tests/rc121-connected-topology-browser.cjs tests/rc121-dream-regression-browser.cjs tests/dream-death-dialog-browser.cjs tests/rc116-laser-telegraph-browser.cjs; do node --check "$f"; done
          git diff --check
          REMOTE=$(git ls-remote origin refs/heads/fix/rc121-connected-dream | cut -f1)
          test "$REMOTE" = "$GITHUB_SHA"
          git add assets/index-v31526.js index.html tests/rc121-dream-regression-browser.cjs tests/rc116-laser-telegraph-browser.cjs
          if ! git diff --cached --quiet; then
            git config user.name 'HAPIL regression workflow'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: resume full-auto combat after native death dialog without stealing manual pauses'
            git push origin HEAD:refs/heads/fix/rc121-connected-dream
          fi
          test -z "$(git status --porcelain)"
          COMMIT=$(git rev-parse HEAD)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "RC121_CANDIDATE_COMMIT=$COMMIT"
          git show --stat --oneline HEAD
  regression:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [dream, death-dialog, topology, release]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Fetch approved art reference
        run: git fetch --no-tags --depth=1 origin 19a4c1f92df16559e43ba822ae0f7b8e74a5c47a
      - name: Install isolated Chromium runtime
        run: |
          QA_RUNTIME="$RUNNER_TEMP/rc121-runtime"
          npm install --prefix "$QA_RUNTIME" --no-save --package-lock=false playwright@1.55.1 > "$RUNNER_TEMP/npm.log" 2>&1
          node "$QA_RUNTIME/node_modules/playwright/cli.js" install --with-deps chromium > "$RUNNER_TEMP/chromium-install.log" 2>&1
          CHROMIUM=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$QA_RUNTIME/node_modules/playwright")
          sudo ln -sf "$CHROMIUM" /usr/bin/chromium
          sudo mkdir -p /workspace/hapil-deliverables/RC119-body
          sudo chown -R "$(id -u):$(id -g)" /workspace/hapil-deliverables
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$QA_RUNTIME/node_modules" >> "$GITHUB_ENV"
          echo "HAPIL_CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
          echo "HAPIL_QA_OUTPUT=$RUNNER_TEMP/rc121-evidence" >> "$GITHUB_ENV"
          echo "HAPIL_RELEASE_OUTPUT=$RUNNER_TEMP/rc121-evidence/release" >> "$GITHUB_ENV"
          /usr/bin/chromium --version
      - name: Test exact clean candidate
        env:
          SUITE: ${{ matrix.suite }}
          TESTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          test -z "$(git status --porcelain)"
          echo "RC121_TESTED_COMMIT=$TESTED_COMMIT suite=$SUITE"
          mkdir -p "$HAPIL_QA_OUTPUT"
          printf '%s\n' "$TESTED_COMMIT" > "$HAPIL_QA_OUTPUT/tested-commit.txt"
          case "$SUITE" in
            dream) node tests/rc121-dream-regression-browser.cjs ;;
            death-dialog) node tests/rc91-samong-and-laser-smoke.cjs && node tests/dream-death-dialog-browser.cjs ;;
            topology) node tests/rc121-connected-topology-browser.cjs ;;
            release) node tests/laser-release-gate.cjs ;;
          esac
      - name: Print concise evidence
        if: always()
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),root=process.env.HAPIL_QA_OUTPUT||'';
          for(const f of ['dream-results.json','death-dialog-results.json','summary.json','release/release-summary.json']){const p=path.join(root,f);if(!fs.existsSync(p))continue;const x=JSON.parse(fs.readFileSync(p));if(x.natural)for(const r of x.natural){delete r.samples;if(r.frames)r.frames={n:r.frames.n,maxGap:r.frames.maxGap,longTasks:r.frames.longTasks?.length};}if(Array.isArray(x))for(const r of x){r.checks=r.rows?.length;delete r.rows;delete r.renderRows;}console.log('RC121_EVIDENCE '+f+' '+JSON.stringify(x).slice(0,35000));}
          for(const sub of ['natural-story','laser-telegraph']){for(const file of ['stdout.log','stderr.log']){const p=path.join(root,'release',sub,file);if(fs.existsSync(p))console.log('RC121_DETAILS '+sub+'/'+file+'\n'+fs.readFileSync(p,'utf8').slice(0,18000));}}
          NODE
          if [ -d /workspace/hapil-deliverables/RC119-body ]; then mkdir -p "$RUNNER_TEMP/rc121-evidence/approved-art"; cp -n /workspace/hapil-deliverables/RC119-body/*.png "$RUNNER_TEMP/rc121-evidence/approved-art/" 2>/dev/null || true; fi
      - name: Preserve exact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rc121-${{ matrix.suite }}-${{ needs.prepare.outputs.commit }}
          path: ${{ runner.temp }}/rc121-evidence/
          retention-days: 14
