name: RC121 source inspection
on:
  push:
    branches: ['fix/rc121-natural-exits-validation']
    paths: ['.github/workflows/rc121-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Inspect final route and asset hooks
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          s=pathlib.Path('assets/index-v31526.js').read_text(); a=s.splitlines()
          print('HEAD',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          for lo,hi in [(121000,121085),(121360,121690),(123790,123855),(32335,32415),(33475,33570)]:
            print('\nRANGE',lo,hi)
            for i in range(lo-1,min(hi,len(a))):print(f'{i+1}: '+(a[i] if len(a[i])<1400 else a[i][:1000]+' ... [long metadata omitted]'))
          for term in ['prepareMap','heroAssets','allHeroes','preload','warmHero','warmup','function Sn','HAPIL_actorChoreography']:
            hits=[i for i,l in enumerate(a) if term in l and len(l)<1800]
            print('\nMATCH',term,'LINES',[i+1 for i in hits][-35:])
            if term in ['prepareMap','heroAssets','allHeroes','warmHero']:
              for i in hits[-5:]:
                for j in range(max(0,i-2),min(len(a),i+4)): print(f'{j+1}: '+a[j][:1200])
          PY
