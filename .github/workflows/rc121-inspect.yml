name: RC121 source inspection
on:
  push:
    branches: ['fix/rc121-natural-exits-validation']
    paths: ['.github/workflows/rc121-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Inspect existing source without changing gameplay
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess,json
          root=pathlib.Path('.')
          print('HEAD',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          print('WORKTREE',subprocess.check_output(['git','status','--porcelain'],text=True).strip())
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          print('TEST_FILES',json.dumps([p for p in files if p.startswith('tests/')],ensure_ascii=False))
          print('MAP_DATA_FILES',json.dumps([p for p in files if re.search(r'(map|world|portal|preload|cache|ending|flow)',p,re.I) and p.endswith(('.js','.json'))],ensure_ascii=False))
          source=(root/'assets/index-v31526.js').read_text(); lines=source.splitlines()
          targets=['MONGSE_zonePortalAnchors','HAPIL_driveAutoProgressV31301','MONGSE_queueImage','MONGSE_prepareZoneAssets','HAPIL_preload','MONGSE_drawPortal']
          for target in targets:
            hits=[i for i,l in enumerate(lines) if target in l]
            print('\nSYMBOL',target,'LINES',[i+1 for i in hits][:25])
            defs=[i for i in hits if re.search(r'(?:function\s+'+re.escape(target)+r'\b|(?:const|let|var)\s+'+re.escape(target)+r'\s*=)',lines[i])]
            for i in defs[:2]:
              stop=min(len(lines),i+220)
              for j in range(i+1,stop):
                if re.match(r'^function\s+\w+',lines[j]):stop=j;break
              print('\n'.join(f'{j+1}: {lines[j]}' for j in range(i,stop)))
          for term in ['memory_portal','interactionExit','__HAPIL_AUTOPROGRESS_V31301__','__HAPIL_FLOW_V31343__','__MONGSE_QA__','preloadHero','preloadAll','ending','mode === `hell`','mode === `dream`']:
            hits=[i for i,l in enumerate(lines) if term in l]
            print('\nREFERENCES',term,'LINES',[i+1 for i in hits][:40])
            if term in ['memory_portal','interactionExit','__HAPIL_AUTOPROGRESS_V31301__','__HAPIL_FLOW_V31343__']:
              for i in hits[:10]:print('\n'.join(f'{j+1}: {lines[j]}' for j in range(max(0,i-3),min(len(lines),i+6))))
          PY
