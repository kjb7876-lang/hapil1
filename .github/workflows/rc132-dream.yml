name: RC132 DREAM combat audit
on:
  push:
    branches: ['fix/rc132-dream-combat-audio']
    paths: ['.github/workflows/rc132-dream.yml', 'tools/rc132-*.cjs', 'tests/rc132-*.cjs', 'assets/rc132/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rc132-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare exact source runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/rc132-runtime" --no-save --package-lock=false acorn@8.15.0 prettier@3.6.2 playwright@1.55.1 > "$RUNNER_TEMP/npm.log" 2>&1
          echo "RC132_MODULES=$RUNNER_TEMP/rc132-runtime/node_modules" >> "$GITHUB_ENV"
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$RUNNER_TEMP/rc132-runtime/node_modules" >> "$GITHUB_ENV"
          echo "HAPIL_QA_OUTPUT=$GITHUB_WORKSPACE/qa/rc132/evidence" >> "$GITHUB_ENV"
      - name: Apply scoped changes and validate unit contracts
        run: |
          set -euo pipefail
          mkdir -p "$HAPIL_QA_OUTPUT"
          node tools/rc132-apply.cjs > "$HAPIL_QA_OUTPUT/apply.log" 2>&1
          node --check assets/index-v31526.js
          node --check assets/combat-v31412/outgoing-native.js
          node --check assets/rc132/dream-balance.js
          node tests/rc132-unit.cjs > "$HAPIL_QA_OUTPUT/unit.log" 2>&1
          cat "$HAPIL_QA_OUTPUT/unit.log"
      - name: Commit candidate runtime without touching main
        run: |
          git config user.name 'HAPIL RC132 candidate'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/index-v31526.js assets/combat-v31412/outgoing-native.js index.html
          if ! git diff --cached --quiet; then
            git commit -m 'RC132 apply scoped DREAM sustain and remove mirror laser'
            git push origin HEAD:refs/heads/fix/rc132-dream-combat-audio
          fi
          git rev-parse HEAD > "$HAPIL_QA_OUTPUT/tested-runtime-commit.txt"
      - name: Run native browser checks when available
        run: |
          if [ -f tests/rc132-browser.cjs ]; then
            node "$RUNNER_TEMP/rc132-runtime/node_modules/playwright/cli.js" install --with-deps chromium > "$HAPIL_QA_OUTPUT/browser-install.log" 2>&1
            export HAPIL_CHROMIUM=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$RUNNER_TEMP/rc132-runtime/node_modules/playwright")
            node tests/rc132-browser.cjs > "$HAPIL_QA_OUTPUT/browser.log" 2>&1
          fi
      - name: Preserve exact result and source evidence
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p qa/rc132/evidence
          node -e "require('fs').writeFileSync('qa/rc132/evidence/workflow.json',JSON.stringify({run:process.env.GITHUB_RUN_ID,startingCommit:process.env.GITHUB_SHA,status:process.env.RESULT},null,2))"
          git config user.name 'HAPIL RC132 evidence'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/rc132/evidence
          git commit -m "RC132 evidence $GITHUB_RUN_ID ($RESULT)"
          git push origin HEAD:refs/heads/qa/rc132-$GITHUB_RUN_ID
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc132-${{ github.run_id }}
          path: qa/rc132/evidence/
          retention-days: 14
