name: RC124 native source inspection
on:
  push:
    branches: [fix/rc124-laser-overrun-boss-hp]
    paths: ['.github/workflows/rc124-source-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Read exact native render and health code without patching
        run: |
          node <<'NODE'
          const fs=require('node:fs'),s=fs.readFileSync('assets/index-v31526.js','utf8');
          console.log('COMMIT',process.env.GITHUB_SHA,'BYTES',Buffer.byteLength(s));
          for(const [a,b]of[[1116900,1124700],[1163100,1166400]])console.log('\nRANGE',a,b,'\n'+s.slice(a,b));
          for(const needle of ['function G(','function MONGSE_enemyUiOffset(','__HAPIL_GEOMETRY_V31345__=','__HAPIL_GEOMETRY_V31345__ =','function Di(']){let at=-1,count=0;while((at=s.indexOf(needle,at+1))>=0&&count++<3)console.log('\nSOURCE',needle,at,'\n'+s.slice(Math.max(0,at-500),at+5000));}
          NODE
