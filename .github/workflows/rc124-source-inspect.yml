name: RC124 native source inspection
on:
  push:
    branches: [fix/rc124-laser-overrun-boss-hp]
    paths: ['.github/workflows/rc124-source-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Read exact native render and health code without patching
        run: |
          node <<'NODE'
          const fs=require('node:fs'),s=fs.readFileSync('assets/index-v31526.js','utf8');
          console.log('COMMIT',process.env.GITHUB_SHA,'BYTES',Buffer.byteLength(s));
          const needles=['function $n(','$n=function','__HAPIL_PORTRAIT_SPLIT_RC108__','__HAPIL_LASER_TOPOLOGY_RC108__','showCombatInfo','healthBar','healthbar','hpBar','miniHealth'];
          for(const needle of needles){let at=-1,count=0;while((at=s.indexOf(needle,at+1))>=0){count++;if(count<=12)console.log('\nSOURCE',JSON.stringify(needle),'OFFSET',at,'\n'+s.slice(Math.max(0,at-550),at+1700));}console.log('MATCHES',needle,count);}
          const re=/maxHp/g;let m,count=0;while((m=re.exec(s))){const text=s.slice(Math.max(0,m.index-450),m.index+600);if(/fillRect|strokeRect|fillStyle|roundRect/.test(text)&&count++<14)console.log('\nHEALTH_RENDER OFFSET',m.index,'\n'+text);}
          NODE
