name: RC170 bounded native Persona candidate regression
on:
  push:
    branches: [codex/rc170-persona-ego-native-fixes]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install normal Chrome Stable and existing parser
        run: |
          npm install --prefix "$RUNNER_TEMP/rc170" --no-save --package-lock=false playwright@1.55.1 acorn@8.15.0
          node "$RUNNER_TEMP/rc170/node_modules/playwright/cli.js" install --with-deps chrome
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$RUNNER_TEMP/rc170/node_modules" >> "$GITHUB_ENV"
      - name: Exact preservation and focused source contracts
        run: |
          node tools/rc133-preservation.cjs
          node tests/rc133-preservation-unit.cjs
          node tests/combat-audio-impact.cjs
          node tests/rc154-cosmic-loader-unit.cjs
          node tests/rc86-samong-cosmic-smoke.cjs
          node tests/rc142-gameplay-unit.cjs
          node tests/rc156-anatomy-preservation-unit.cjs
          node tests/rc133-published-url.cjs
          node tests/chromium-sandbox-policy.cjs
          node tests/rc170-victory-contract-unit.cjs
          node tests/rc170-player-defense-art-unit.cjs
          node tests/rc170-persona-flight-unit.cjs
          node tests/rc155-ego-guardian-unit.cjs
          node tests/rc150-awakening-impact.cjs
      - name: Real-media native audio collision and suppression matrix
        env:
          HAPIL_COMBAT_AUDIO_OUTPUT: ${{ runner.temp }}/rc170-combat-audio
        run: |
          timeout 180s node tests/rc165-audio-browser.cjs
          test -z "$(git status --porcelain)"
      - name: Actual 777 first and final KO, native flight and guard, rendered village save and reverse
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RC170_CAPTURE_DIR: ${{ runner.temp }}/rc170-captures
        run: |
          mkdir -p "$RC170_CAPTURE_DIR"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          timeout 180s node tests/rc170-persona-native-regression.cjs
      - name: Upload rendered browser captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rc170-persona-native-captures-${{ github.sha }}
          path: ${{ runner.temp }}/rc170-captures/
          if-no-files-found: ignore
          retention-days: 3
