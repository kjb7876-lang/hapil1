name: RC131 hero image investigation
on:
  push:
    branches: ['fix/rc131-hero-image-recovery']
    paths: ['.github/workflows/rc131-hero-audit.yml','tests/rc131-hero-images.cjs']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/rc131-runtime" --no-save --package-lock=false playwright@1.55.1 > /tmp/rc131-npm.log 2>&1
          node "$RUNNER_TEMP/rc131-runtime/node_modules/playwright/cli.js" install --with-deps chromium > /tmp/rc131-browser.log 2>&1
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$RUNNER_TEMP/rc131-runtime/node_modules" >> "$GITHUB_ENV"
          echo "HAPIL_CHROMIUM=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$RUNNER_TEMP/rc131-runtime/node_modules/playwright")" >> "$GITHUB_ENV"
          echo "HAPIL_QA_OUTPUT=$RUNNER_TEMP/rc131-baseline" >> "$GITHUB_ENV"
      - name: Observe per-hero pixel and pending-image failures without hiding baseline results
        run: node tests/rc131-hero-images.cjs --observe
      - name: Print relevant native implementation
        if: always()
        run: |
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('assets/index-v31526.js','utf8');
          for(const term of ['function HAPIL_consistentHeroDrawRC5','const selected=options?.canonicalHeroRC5','function hero(ctx,cache,path,x,y,size,opts={})']){const at=s.indexOf(term);console.log('NATIVE_SOURCE_LINE',term,s.slice(0,Math.max(0,at)).split('\n').length);if(at>=0)console.log(s.slice(Math.max(0,at-5000),at+1800));}
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc131-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/rc131-baseline/
          retention-days: 14
