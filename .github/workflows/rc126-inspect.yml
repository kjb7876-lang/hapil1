name: RC126 combat path inspection
on:
  push:
    branches: [fix/rc126-combat-readability]
    paths: ['.github/workflows/rc126-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Read finite contact and final projectile contracts
        run: |
          node <<'NODE'
          const fs=require('fs'),lines=fs.readFileSync('assets/index-v31526.js','utf8').split('\n');
          function show(a,b){console.log('\nRANGE '+a+'-'+b+'\n'+lines.slice(a-1,b).map((s,i)=>(a+i)+': '+s).join('\n'));}
          for(const needle of ['function Di(','function MONGSE_pushThemeProjectile3129','function MONGSE_stepSignatureProjectile31212','renderNative(','function bind(e,s=state)','function prepareHits(','function begin(s','function finish(s']){
            const ix=[];for(let i=0;i<lines.length;i++)if(lines[i].includes(needle))ix.push(i);console.log('MATCHES',needle,ix.map(i=>i+1));for(const i of ix.slice(-2))show(Math.max(1,i-2),Math.min(lines.length,i+(needle.startsWith('function MONGSE_')?160:25)));
          }
          show(61935,62035);show(116495,116585);
          console.log('JELLY_PATHS',[...new Set(fs.readFileSync('assets/index-v31526.js','utf8').match(/\.\/assets\/[^\s'"`<>]*?(?:jelly|bean)[^\s'"`<>]*?\.(?:webp|png)/g)||[])]);
          NODE
