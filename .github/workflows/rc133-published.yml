name: RC133 published Pages verification
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/index-v31526.js'
      - 'assets/rc133/**'
      - 'assets/rc137/**'
      - 'qa/rc137/**'
      - 'qa/rc133/art-processing.json'
      - 'qa/rc133/published.cjs'
      - 'qa/rc133/public-url.cjs'
      - 'tests/rc142-gameplay-unit.cjs'
      - 'tests/rc147-*.cjs'
      - 'tests/rc142-gameplay-browser.cjs'
      - 'qa/rc133/authorized-runtime-extension.json'
      - 'qa/rc133/authorized-runtime-extension-4.json'
      - 'qa/rc133/authorized-runtime-extension-5.json'
      - 'qa/rc133/authorized-runtime-extension-10.json'
      - 'qa/rc133/authorized-runtime-extension-11.json'
      - 'qa/rc133/authorized-runtime-extension-12.json'
      - 'qa/rc133/authorized-runtime-extension-13.json'
      - 'tests/chromium-sandbox-policy.cjs'
      - 'tests/rc153-chrome-sandbox-smoke.cjs'
      - 'tools/rc133-preservation.cjs'
      - '.github/workflows/rc133-published.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc133-published-${{ github.ref }}
  cancel-in-progress: false
jobs:
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare isolated read-only browser
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/rc133-public-runtime"
          mkdir -p "$RUNNER_TEMP/rc133-public"
          npm install --prefix "$R" --no-save --package-lock=false playwright@1.55.1 > "$RUNNER_TEMP/npm.log" 2>&1
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$R/node_modules" >> "$GITHUB_ENV"
          echo "HAPIL_QA_OUTPUT=$RUNNER_TEMP/rc133-public" >> "$GITHUB_ENV"
      - name: Verify Chrome Stable sandbox before public assertions
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
          node tests/chromium-sandbox-policy.cjs
          node tests/rc153-chrome-sandbox-smoke.cjs
      - name: Verify approved historical and exact extension deltas
        run: node tools/rc133-preservation.cjs
      - name: Verify exact public bytes and normal game startup
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node qa/rc133/published.cjs
      - name: Publish allowlisted public verification status
        if: always()
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),p=path.join(process.env.HAPIL_QA_OUTPUT,'summary.json');
          const x=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{};
          const status=['passed','failed','running'].includes(x.status)?x.status:'unavailable';
          const row={status,expectedFiles:Number.isSafeInteger(x.expectedFiles)?x.expectedFiles:null,verifiedFiles:Array.isArray(x.files)?x.files.filter(v=>v.status==='passed').length:0,readinessAttempts:Array.isArray(x.readiness)?x.readiness.length:0,passedProfiles:Array.isArray(x.profiles)?x.profiles.filter(v=>v.status==='passed').length:0};
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Public verification status\n\n```json\n'+JSON.stringify(row,null,2)+'\n```\n');
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc133-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc133-public/
          retention-days: 14
