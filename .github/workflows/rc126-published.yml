name: RC126 published Pages verification
on:
  push:
    branches: [main]
    paths: ['assets/**', 'index.html', 'qa/rc126/published-smoke.cjs', '.github/workflows/rc126-published.yml']
permissions:
  contents: read
concurrency:
  group: rc126-published-${{ github.ref }}
  cancel-in-progress: false
jobs:
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare isolated read-only browser
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/rc126-runtime"
          npm install --prefix "$R" --no-save --package-lock=false playwright@1.55.1 > "$RUNNER_TEMP/npm.log" 2>&1
          node "$R/node_modules/playwright/cli.js" install --with-deps chromium > "$RUNNER_TEMP/browser.log" 2>&1
          CHROMIUM=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$R/node_modules/playwright")
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$R/node_modules" >> "$GITHUB_ENV"
          echo "HAPIL_CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
          echo "HAPIL_QA_OUTPUT=$RUNNER_TEMP/rc126-public" >> "$GITHUB_ENV"
      - name: Wait for exact published HTML; never alter deployed state
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const expected=hash(fs.readFileSync('index.html'));
          (async()=>{for(let n=0;n<30;n++){
            try{const r=await fetch('https://kjb7876-lang.github.io/hapil1/?rc126-ready='+Date.now(),{signal:AbortSignal.timeout(15000)});if(r.ok&&hash(Buffer.from(await r.arrayBuffer()))===expected){console.log('Exact HTML deployment ready',expected);return;}}
            catch(e){console.log('Readiness retry',n,e.message);}
            await new Promise(r=>setTimeout(r,10000));
          }throw Error('Expected Pages HTML not published within verification window');})().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Compare public runtime bytes and observe PC/portrait/landscape startup
        run: node qa/rc126/published-smoke.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc126-public-${{ github.sha }}
          path: ${{ runner.temp }}/rc126-public/
          retention-days: 14
