name: RC146 global body ash exact candidate
on:
  push:
    branches: [main, codex/rc145-body-dissolve-preview]
    paths:
      - 'assets/index-v31526.js'
      - 'assets/rc145/body-ash.js'
      - 'index.html'
      - 'tests/rc145-body-ash-browser.cjs'
      - 'tests/rc146-global-body-browser.cjs'
      - 'qa/rc133/authorized-runtime-extension-5.json'
      - 'qa/rc133/published.cjs'
      - 'tools/rc133-preservation.cjs'
      - 'tools/rc133-release-compatibility.cjs'
      - '.github/workflows/rc146-global-body.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc146-global-body-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [pc, portrait, landscape]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare isolated Chromium
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/rc146-runtime"
          npm install --prefix "$R" --no-save --package-lock=false playwright@1.55.1
          node "$R/node_modules/playwright/cli.js" install --with-deps chromium
          CHROMIUM=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$R/node_modules/playwright")
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$R/node_modules" >> "$GITHUB_ENV"
          echo "HAPIL_CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
          echo "HAPIL_QA_OUTPUT=$RUNNER_TEMP/rc146-evidence" >> "$GITHUB_ENV"
      - name: Verify exact source, preservation and native body rendering
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RC145_PROFILE: ${{ matrix.profile }}
          RC144_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          node --check assets/index-v31526.js
          node --check assets/rc145/body-ash.js
          node tests/rc145-body-ash-browser.cjs
          HAPIL_QA_OUTPUT="$RUNNER_TEMP/rc146-evidence/rc144" node tests/rc144-death-burn-browser.cjs
          if test "$RC145_PROFILE" = pc; then
            HAPIL_QA_OUTPUT="$RUNNER_TEMP/rc146-evidence/global" node tests/rc146-global-body-browser.cjs
            node tools/rc133-preservation.cjs > "$RUNNER_TEMP/rc146-evidence/preservation.log"
            node tests/rc133-preservation-unit.cjs
            node tests/rc133-published-url.cjs
          fi
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc146-${{ github.sha }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/rc146-evidence/
          retention-days: 14
