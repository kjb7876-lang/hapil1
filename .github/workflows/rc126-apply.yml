name: RC126 guarded combat integration
on:
  push:
    branches: [fix/rc126-combat-safety]
    paths: ['.github/workflows/rc126-apply.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/rc126-combat-safety'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Integrate exact baseline and run pure simulation checks
        run: |
          set -euo pipefail
          node tools/apply-rc126.cjs
          node tests/rc126-combat-safety-smoke.cjs
          node tests/rc43-bloodied-projectile-flight.cjs
          git diff --check
      - name: Commit only to the candidate branch without force
        run: |
          set -euo pipefail
          EXPECTED=$(git ls-remote origin refs/heads/fix/rc126-combat-safety | cut -f1)
          test "$EXPECTED" = "$GITHUB_SHA"
          git config user.name 'HAPIL combat integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/index-v31526.js index.html assets/rc95/combat-flow.js assets/combat-v31402/projectile-pipeline.js assets/combat-v31402/contact-geometry.js assets/rc43/bloodied-flight.js
          git commit -m 'RC126: integrate finite native beams, paced volleys, map asset ledger and safe contacts'
          git push origin HEAD:refs/heads/fix/rc126-combat-safety
          echo "RC126_CANDIDATE=$(git rev-parse HEAD)"
