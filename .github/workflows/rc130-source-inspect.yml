name: RC130 native source inspection
on:
  push:
    branches: ['fix/rc130-projectile-cap-melee-audio']
    paths: ['.github/workflows/rc130-source-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - name: Read exact native integration points
        run: |
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('assets/index-v31526.js').read_text();lines=text.splitlines()
          for name in ['Jn','MONGSE_spawnTelegraphedImpact','MONGSE_spawnBossImpactTransitV31232']:
            matches=list(re.finditer(r'^function '+re.escape(name)+r'\(',text,re.M))
            for m in matches:
              end=re.search(r'^function ',text[m.end():],re.M)
              chunk=text[m.start():m.end()+end.start() if end else m.start()+18000]
              print('\nFUNCTION',name,'LINE',text.count('\n',0,m.start())+1,'\n'+chunk[:20000])
          for token,limit,before,after in [('function poses(',1,1300,5800),('function bind(e,s=state)',1,500,3600),('projectileRenderer.dispatch',2,500,1000),('__HAPIL_PROJECTILE_RENDER_V31402__',3,500,900),('attackType === `melee`',6,500,1700),('attackType===\'melee\'',6,500,1700),('hero-blade-soft-low',3,800,1800),('__HAPIL_FEEDBACK_RC22__',4,350,950),('enemyAttack',4,500,1700)]:
            found=list(re.finditer(re.escape(token),text));print('\nTOKEN',token,'COUNT',len(found))
            for m in found[:limit]: print('LINE',text.count('\n',0,m.start())+1,'\n'+text[max(0,m.start()-before):m.end()+after])
          PY
