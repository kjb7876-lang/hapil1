name: RC131 uploaded audio and gameplay verification
on:
  push:
    branches: ['fix/rc131-audio-resume']
permissions:
  contents: write
concurrency:
  group: rc131-candidate
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply minimal audio integration and pin tested commit
        run: |
          set -euo pipefail
          node tools/rc131-integration.cjs
          for f in assets/index-v31526.js assets/rc131/audio-cues.js assets/combat-audio/v1/native-bridge.js assets/rc23/feedback.js assets/rc128/combat-feedback.js; do node --check "$f"; done
          git config user.name 'HAPIL RC131 integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/index-v31526.js assets/rc23/feedback.js assets/rc128/combat-feedback.js assets/combat-audio/v1/native-bridge.js tools/rc130-preservation.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'RC131 integrate selected uploaded cues and priority-aware native audio admission'
            git push origin HEAD:refs/heads/fix/rc131-audio-resume
          fi
          git rev-parse HEAD
      - name: Prepare browser and media validators
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/rc131-runtime"
          npm install --prefix "$R" --no-save --package-lock=false playwright@1.55.1 > "$RUNNER_TEMP/npm.log" 2>&1
          node "$R/node_modules/playwright/cli.js" install --with-deps chromium > "$RUNNER_TEMP/browser.log" 2>&1
          if ! command -v ffprobe >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg > "$RUNNER_TEMP/ffmpeg-install.log" 2>&1; fi
          CHROMIUM=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$R/node_modules/playwright")
          sudo ln -sf "$CHROMIUM" /usr/bin/chromium
          sudo mkdir -p /workspace/hapil-deliverables/RC119-body
          sudo chown -R "$(id -u):$(id -g)" /workspace/hapil-deliverables
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$R/node_modules" >> "$GITHUB_ENV"
          echo "HAPIL_CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
          echo "HAPIL_QA_OUTPUT=$RUNNER_TEMP/rc131-results" >> "$GITHUB_ENV"
          git fetch --no-tags --depth=1 origin 19a4c1f92df16559e43ba822ae0f7b8e74a5c47a
      - name: Run unchanged-gameplay and native-audio checks
        run: node tests/rc131-suite.cjs
      - name: Record results without promoting a failed candidate
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/rc131-results/summary.json" ]; then
            mkdir -p qa/rc131/evidence
            cp "$RUNNER_TEMP/rc131-results/summary.json" qa/rc131/evidence/summary.json
            if [ -f "$RUNNER_TEMP/rc131-results/rc131-browser/summary.json" ]; then cp "$RUNNER_TEMP/rc131-results/rc131-browser/summary.json" qa/rc131/evidence/native-audio.json; fi
            git config user.name 'HAPIL RC131 evidence'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add qa/rc131/evidence
            if ! git diff --cached --quiet; then git commit -m "RC131 exact test evidence $GITHUB_RUN_ID"; fi
            git push origin HEAD:refs/heads/qa/rc131-$GITHUB_RUN_ID
            cat "$RUNNER_TEMP/rc131-results/summary.json"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc131-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/rc131-results/
          retention-days: 14
          if-no-files-found: warn
