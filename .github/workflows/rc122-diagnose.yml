name: RC122 diagnostic
on:
  workflow_dispatch:
  push:
    branches: [fix/rc122-autoplay-transitions]
    paths: ['.github/workflows/rc122-diagnose.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Copy exact source windows for review
        run: |
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('assets/index-v31526.js','utf8'),l=s.split('\n'),d='qa-results/rc122';fs.mkdirSync(d,{recursive:true});
          const blocks={frame:[54310,54810],evade:[19470,19890],autoprofile:[40080,40200],anchors:[29480,29710],flow:[121480,121730],autoprogress:[99710,99850],laser:[120260,120410]};
          for(const [k,[a,b]]of Object.entries(blocks))fs.writeFileSync(`${d}/source-${k}.txt`,l.slice(a-1,b).map((x,i)=>(a+i)+': '+x).join('\n'));
          const refs=[];for(let i=0;i<l.length;i++)if(/MONGSE_autoRoleMovementIntent31222\s*=|MONGSE_planHeroAutoDodge31223\s*=|MONGSE_zonePortalAnchors\(|drawExit\(|MONGSE_planHeroAutoDodge31223\(/.test(l[i]))refs.push(l.slice(Math.max(0,i-4),i+7).map((x,k)=>(Math.max(0,i-4)+k+1)+': '+x).join('\n'));fs.writeFileSync(`${d}/source-hooks.txt`,refs.join('\n\n'));
          NODE
          node --check tests/rc122-autoplay-diagnostic.cjs
          git add qa-results/rc122/source-*.txt
          git config user.name 'HAPIL QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'test: capture exact autoplay and exit source windows'
          git push origin HEAD:refs/heads/fix/rc122-autoplay-transitions
      - name: Chromium runtime
        run: |
          R="$RUNNER_TEMP/rc122-runtime"
          npm install --prefix "$R" --no-save --package-lock=false playwright@1.55.1 > /tmp/rc122-npm.log 2>&1
          node "$R/node_modules/playwright/cli.js" install --with-deps chromium > /tmp/rc122-browser.log 2>&1
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$R/node_modules" >> "$GITHUB_ENV"
          echo "HAPIL_CHROMIUM=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$R/node_modules/playwright")" >> "$GITHUB_ENV"
      - name: Natural desktop and portrait diagnostics
        run: node tests/rc122-autoplay-diagnostic.cjs
      - name: Preserve diagnostic observations
        if: always()
        run: |
          git add qa-results/rc122
          git diff --cached --quiet || git commit -m 'test: record natural RC121 desktop and portrait comparison'
          git push origin HEAD:refs/heads/fix/rc122-autoplay-transitions
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc122-diagnostics
          path: qa-results/rc122/
          retention-days: 14
