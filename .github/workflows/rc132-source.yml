name: RC132 targeted source evidence
on:
  push:
    branches: ['fix/rc132-dream-combat-audio']
    paths: ['.github/workflows/rc132-source.yml']
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Extract functions without editing the runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/inspect" --no-save --package-lock=false acorn@8.15.0 prettier@3.6.2 >/dev/null 2>&1
          INSPECT_MODULES="$RUNNER_TEMP/inspect/node_modules" node <<'NODE'
          const fs=require('fs'),path=require('path');const acorn=require(process.env.INSPECT_MODULES+'/acorn'),prettier=require(process.env.INSPECT_MODULES+'/prettier');
          (async()=>{const s=fs.readFileSync('assets/index-v31526.js','utf8'),ast=acorn.parse(s,{ecmaVersion:'latest',sourceType:'module'}),funcs=[];
          function visit(n,parent){if(!n||typeof n!=='object')return;if(/Function/.test(n.type)&&n.body){const name=n.id?.name||parent?.key?.name||parent?.id?.name||'anonymous';funcs.push({start:n.start,end:n.end,name});}for(const[k,v]of Object.entries(n)){if(k==='start'||k==='end')continue;if(Array.isArray(v))for(const a of v)visit(a,n);else if(v&&typeof v.type==='string')visit(v,n);}}visit(ast,null);
          const out='qa/rc132-source';fs.mkdirSync(out+'/functions',{recursive:true});const saved=new Map();
          async function location(index){const f=funcs.filter(f=>f.start<=index&&f.end>index).sort((a,b)=>(a.end-a.start)-(b.end-b.start))[0];if(!f||f.end-f.start>100000)return{offset:index,context:s.slice(Math.max(0,index-180),index+250)};const key=f.name+'-'+f.start;if(!saved.has(key)){let text=s.slice(f.start,f.end);try{text=await prettier.format(text,{parser:'babel'});}catch{}fs.writeFileSync(out+'/functions/'+key+'.txt',text);saved.set(key,true);}return{offset:index,function:f.name,path:'functions/'+key+'.txt',length:f.end-f.start,context:s.slice(Math.max(0,index-100),index+180)};}
          const terms=['악몽궁수','분노의 귀','분노의귀','거울','mirror','lifesteal','lifeSteal','vampir','drain','dreamStage','heroHealingCeiling'];const report={commit:process.env.GITHUB_SHA,terms:{}};
          for(const t of terms){const matches=[];let at=-1;while((at=s.toLowerCase().indexOf(t.toLowerCase(),at+1))>=0){if(matches.length<25)matches.push(await location(at));}report.terms[t]=matches;}
          for(const[t,rows]of Object.entries(report.terms))fs.writeFileSync(out+'/'+encodeURIComponent(t)+'.json',JSON.stringify(rows,null,2));
          const hp=[];for(const m of s.matchAll(/\.hp\s*(?:=\s*Math\.min|\+=)/g))hp.push(await location(m.index));fs.writeFileSync(out+'/hp-recovery.json',JSON.stringify(hp,null,2));
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);report.related=[];
          for(const f of ['assets','tests','data','tools'].flatMap(walk)){if(!/\.(?:c?js|json|md)$/.test(f)||f==='assets/index-v31526.js')continue;const text=fs.readFileSync(f,'utf8'),hits=terms.concat(['Short_male_combat','Short_female_combat','Temporal Stutter','歪時計']).filter(t=>text.toLowerCase().includes(t.toLowerCase()));if(hits.length)report.related.push({path:f,length:text.length,terms:hits});}
          fs.writeFileSync(out+'/index.json',JSON.stringify({commit:report.commit,terms:Object.fromEntries(Object.entries(report.terms).map(([t,r])=>[t,{count:r.length,functions:[...new Set(r.map(x=>x.function||'top-level'))]}])),hpAssignments:hp.length,related:report.related},null,2));console.log('source functions',saved.size,'HP recovery assignments',hp.length);})();
          NODE
      - name: Preserve source evidence on separate branch
        run: |
          git config user.name 'HAPIL RC132 source evidence'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/rc132-source
          git commit -m 'RC132 exact native source evidence'
          git push origin HEAD:refs/heads/qa/rc132-source-$GITHUB_RUN_ID
