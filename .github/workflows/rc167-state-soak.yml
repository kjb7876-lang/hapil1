name: RC167 normal-input state accumulation soak
on:
  push:
    branches: [codex/rc167-state-soak]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install normal Chrome Stable validation runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --prefix "$RUNNER_TEMP/rc167" --no-save --package-lock=false playwright@1.55.1 acorn@8.15.0
          node "$RUNNER_TEMP/rc167/node_modules/playwright/cli.js" install --with-deps chrome
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$RUNNER_TEMP/rc167/node_modules" >> "$GITHUB_ENV"
      - name: Validate exact SHA and preservation
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          node tests/combat-audio-controller.cjs
          node tests/combat-audio-native-sfx.cjs
          node tests/combat-audio-impact.cjs
          node tests/rc154-cosmic-loader-unit.cjs
          node tests/rc156-anatomy-preservation-unit.cjs
          node tests/rc142-gameplay-unit.cjs
          node tests/rc133-preservation-unit.cjs
          node tests/rc133-published-url.cjs
          node tests/rc155-ego-art-unit.cjs
          node tests/rc158-persona-presentation-unit.cjs
          node tests/rc137-direction-input-unit.cjs
          node tests/rc133-duel-hitboxes.cjs
          node tests/rc163-egohandoff-unit.cjs
      - name: Targeted fresh-document slot readiness after completed combat soak
        run: |
          test -z "$(git diff c83b811447c6430698f31a31ec33a5b15269b101 HEAD -- assets audio data index.html)"
          node tests/rc167-state-soak.cjs --slot-only
          test -z "$(git status --porcelain)"
