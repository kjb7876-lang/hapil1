# Full regression for the portrait composition correction above reviewed091 core.
name: Canonical story narration audit
on:
  push:
    branches: [main, 'dot/story-narration-qa-*', codex/rc133-media-integration, codex/rc133-both-first-lethal, codex/rc133-hidden-portrait-contrast, codex/rc134-mobile-quality, codex/rc134-fullauto-balance, codex/rc134-persona-mirror, codex/rc134-integrated, codex/rc137-boss-art-review, codex/rc140-story-murder-sprites-voice, codex/rc141-natural-audio-followup, codex/rc142-gameplay-audit, codex/rc143-persona-mobile-cult, codex/rc152-image-combat]
    paths:
      - '.github/workflows/story-narration-audit.yml'
      - 'tests/rc154*'
      - 'tests/rc147-*.cjs'
      - 'assets/story-narration/**'
      - 'assets/combat-audio/**'
      - 'assets/rc91/samong-awakening.js'
      - 'assets/rc133/**'
      - 'assets/rc134/**'
      - 'assets/rc142/**'
      - 'assets/rc137/**'
      - 'assets/rc138/**'
      - 'assets/rc139/**'
      - 'assets/rc153/**'
      - 'assets/index-v31526.js'
      - 'tests/combat-audio*'
      - 'tests/lib/combat-audio-catalog.cjs'
      - 'qa/rc133/published.cjs'
      - 'qa/rc153/**'
      - 'qa/rc130/public-smoke.cjs'
      - 'qa/rc132/published.cjs'
      - 'tests/chromium-sandbox-policy.cjs'
      - 'tests/story-narration-decoder-edges.cjs'
      - 'tests/fixtures/story-narration-chrome-stable-v154.json'
      - 'tests/rc153-chrome-sandbox-smoke.cjs'
      - 'tools/combat-audio-apply.cjs'
      - 'tools/rc130-preservation.cjs'
      - 'tools/rc133-*.cjs'
      - 'tests/rc128-candidate.cjs'
      - 'tests/laser-release-gate.cjs'
      - 'tests/rc91-samong-and-laser-smoke.cjs'
      - 'tests/rc133-*.cjs'
      - 'tests/rc134-*.cjs'
      - 'tests/rc137-*.cjs'
      - 'tests/rc138-*.cjs'
      - 'tests/rc139-*.cjs'
      - 'tests/rc142-*.cjs'
      - 'tests/rc143-*.cjs'
      - 'tests/rc153-*.cjs'
      - 'qa/rc142/**'
      - 'tools/story-narration-release73-preservation.cjs'
      - 'tools/story-narration-release82-preservation.cjs'
      - 'tools/story-narration-release85-preservation.cjs'
      - 'tools/story-narration-release86-preservation.cjs'
      - 'tests/rc121-connected-topology-browser.cjs'
      - 'tests/rc121-dream-regression-browser.cjs'
      - 'tests/dream-death-dialog-browser.cjs'
      - 'tests/rc108-combat-browser.cjs'
      - 'tests/rc115-natural-story-portal-browser.cjs'
      - 'tests/rc116-laser-*-browser.cjs'
      - 'tests/rc118-laser-phase-browser.cjs'
      - 'tests/rc119-laser-body-browser.cjs'
      - 'tests/rc122-autoplay-browser.cjs'
      - 'tests/rc123-boundary-browser.cjs'
      - 'tests/rc125-*-browser.cjs'
      - 'tests/rc126-combat-browser.cjs'
      - 'tests/rc127-browser.cjs'
      - 'tests/rc128-browser.cjs'
      - 'tests/rc129-browser.cjs'
      - 'assets/rc51/story.js'
      - 'assets/title/v31236/christian-opening-v31236.js'
      - 'data/story-rc51.js'
      - 'data/rc57/voice-monologue-*.txt'
      - 'tools/replace-narrative-ellipsis.cjs'
      - 'tools/narrative-proofreads.cjs'
      - 'data/rc57/narrative-proofreads-20261002.json'
      - 'tests/story-narration*'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: story-narration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  published-audio:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify exact deployed narration and original audio bytes
        env:
          HAPIL_PUBLIC_URL: https://kjb7876-lang.github.io/hapil1/
          TESTED_COMMIT: ${{ github.sha }}
        run: |
          node tests/story-narration-published.cjs
          node tests/combat-audio-published.cjs
  narration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install media verification tools
        run: sudo apt-get install -y ffmpeg
      - name: Validate canonical source and original voice contracts
        run: |
          node --check assets/combat-audio/v1/catalog.js
          node --check assets/combat-audio/v1/controller.js
          node --check assets/combat-audio/v1/native-bridge.js
          node tests/combat-audio-assets.cjs
          node tests/combat-audio-catalog.cjs
          node --test tests/combat-audio-controller.cjs tests/combat-audio-bridge.cjs tests/combat-audio-native-sfx.cjs tests/combat-audio-impact.cjs
          node --check assets/story-narration/v1/player.js
          node --check assets/story-narration/v1/mixer.js
          node --check assets/rc49/story-voice.js
          node --check assets/rc51/story.js
          node --check assets/story-narration/v1/surfaces.js
          node --check assets/title/v31236/christian-opening-v31236.js
          node tests/rc48-story-voice-smoke.cjs
          node tests/rc51-story-and-samong-smoke.cjs
          node tests/rc74-flight-voice-lifecycle.cjs
          node tests/rc75-ending-and-awakening.cjs
          node tests/rc89-narrative-smoke.cjs
          node tests/story-narration-text.cjs
          node tests/story-narration-proofreads.cjs
          node tests/story-narration-manifest.cjs
          node tools/story-narration-release86-preservation.cjs
          node --test tests/story-narration-media-races.cjs tests/story-narration-overlap.cjs tests/story-narration-webaudio-races.cjs tests/story-narration-original-timing.cjs tests/story-narration-mixing.cjs
      - name: Install isolated browser runtime
        run: |
          QA_RUNTIME="$RUNNER_TEMP/story-narration-runtime"
          npm install --prefix "$QA_RUNTIME" --no-save --package-lock=false playwright@1.55.1
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$QA_RUNTIME/node_modules" >> "$GITHUB_ENV"
      - name: Exercise playback and interrupted flows
        env:
          HAPIL_NARRATION_OUTPUT: ${{ runner.temp }}/story-narration-evidence
          HAPIL_COMBAT_AUDIO_OUTPUT: ${{ runner.temp }}/story-narration-evidence/combat-audio
        run: |
          node tests/chromium-sandbox-policy.cjs
          command -v google-chrome
          google-chrome --version
          node tests/rc153-chrome-sandbox-smoke.cjs
          node tests/story-narration-browser.cjs
          node tests/story-narration-surfaces-browser.cjs
          node tests/story-narration-audio-browser.cjs
          node tests/story-narration-webaudio-browser.cjs
          node tests/combat-audio-browser.cjs
          HAPIL_DECODER_EDGE_REPORT="$HAPIL_NARRATION_OUTPUT/decoder-edges.json" node tests/story-narration-decoder-edges.cjs
          HAPIL_QA_OUTPUT="$HAPIL_NARRATION_OUTPUT/local-public" node tests/rc133-public-contract.cjs
      - name: Preserve narration layout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: narration-layout-${{ github.sha }}
          path: ${{ runner.temp }}/story-narration-evidence/
          if-no-files-found: warn
          retention-days: 14
  gameplay-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [dream, death-dialog, topology, release]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Fetch approved art reference
        run: git fetch --no-tags --depth=1 origin 19a4c1f92df16559e43ba822ae0f7b8e74a5c47a
      - name: Install isolated Playwright runtime
        run: |
          QA_RUNTIME="$RUNNER_TEMP/rc121-runtime"
          npm install --prefix "$QA_RUNTIME" --no-save --package-lock=false playwright@1.55.1 > "$RUNNER_TEMP/npm.log" 2>&1
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$QA_RUNTIME/node_modules" >> "$GITHUB_ENV"
          echo "HAPIL_QA_OUTPUT=$RUNNER_TEMP/narration-gameplay-evidence" >> "$GITHUB_ENV"
          echo "HAPIL_RELEASE_OUTPUT=$RUNNER_TEMP/narration-gameplay-evidence/release" >> "$GITHUB_ENV"
          echo "RC119_BODY_OUTPUT=$RUNNER_TEMP/narration-gameplay-evidence/release/approved-art" >> "$GITHUB_ENV"
      - name: Test exact clean revision
        env:
          SUITE: ${{ matrix.suite }}
          TESTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          test -z "$(git status --porcelain)"
          node tests/chromium-sandbox-policy.cjs
          command -v google-chrome
          google-chrome --version
          node tests/rc153-chrome-sandbox-smoke.cjs
          echo "RC121_TESTED_COMMIT=$TESTED_COMMIT suite=$SUITE"
          mkdir -p "$HAPIL_QA_OUTPUT"
          printf '%s\n' "$TESTED_COMMIT" > "$HAPIL_QA_OUTPUT/tested-commit.txt"
          case "$SUITE" in
            dream) node tests/rc121-dream-regression-browser.cjs ;;
            death-dialog) node tests/rc91-samong-and-laser-smoke.cjs && node tests/dream-death-dialog-browser.cjs ;;
            topology) node tests/rc121-connected-topology-browser.cjs ;;
            release) node tests/laser-release-gate.cjs && node tests/rc142-gameplay-unit.cjs && node tests/rc142-gameplay-browser.cjs && node tests/rc142-movement-space-browser.cjs && node tests/rc142-persona-volley-browser.cjs ;;
          esac
      - name: Publish allowlisted test status only
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),root=process.env.HAPIL_QA_OUTPUT;
          const statuses=new Set(['passed','failed','running']),suites=new Set(['rc128-candidate','renderer-syntax','bundle-syntax','approved-art','laser-phases','laser-continuity','laser-telegraph','combat','map-advance','natural-story']);
          const rows=[];for(const file of ['release/release-summary.json','release/rc128-candidate/results.json','persona-volley-results.json','movement-space-results.json']){const p=path.join(root,file);if(!fs.existsSync(p))continue;try{const x=JSON.parse(fs.readFileSync(p,'utf8')),row={test:file,status:statuses.has(x.status)?x.status:'unknown',category:typeof x.failure==='string'?(x.failure.includes('browser volley frame stress')?'frame-stall':x.failure.includes('timed out')?'timeout':x.failure.includes('AssertionError')?'assertion':'other'):'none'};if(Array.isArray(x.suites))row.suites=x.suites.filter(r=>suites.has(r.name)).map(r=>({name:r.name,status:statuses.has(r.status)?r.status:'unknown'}));if(Array.isArray(x.profiles))row.profiles=x.profiles.filter(r=>['pc','portrait','landscape'].includes(r.name)).map(r=>({name:r.name,frames:Number.isFinite(r.frameStress?.frames)?r.frameStress.frames:null,maxLongTaskMs:Array.isArray(r.frameStress?.longTaskDurations)?Math.max(0,...r.frameStress.longTaskDurations.filter(Number.isFinite)):null}));rows.push(row);}catch{rows.push({test:file,status:'parse-error'});}}
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Allowlisted test status\n\nNo stderr, error messages, paths or environment values are included.\n\n```json\n'+JSON.stringify(rows,null,2)+'\n```\n');
          NODE
      - name: Print concise evidence
        if: always()
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),root=process.env.HAPIL_QA_OUTPUT||'';
          for(const f of ['dream-results.json','death-dialog-results.json','summary.json','release/release-summary.json']){const p=path.join(root,f);if(!fs.existsSync(p))continue;const x=JSON.parse(fs.readFileSync(p));if(x.natural)for(const r of x.natural){delete r.samples;if(r.frames)r.frames={n:r.frames.n,maxGap:r.frames.maxGap,longTasks:r.frames.longTasks?.length};}if(Array.isArray(x))for(const r of x){r.checks=r.rows?.length;delete r.rows;delete r.renderRows;}console.log('RC121_EVIDENCE '+f+' '+JSON.stringify(x).slice(0,35000));}
          for(const sub of ['natural-story','laser-telegraph']){for(const file of ['stdout.log','stderr.log']){const p=path.join(root,'release',sub,file);if(fs.existsSync(p))console.log('RC121_DETAILS '+sub+'/'+file+'\n'+fs.readFileSync(p,'utf8').slice(0,18000));}}
          NODE
      - name: Preserve exact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: narration-gameplay-${{ matrix.suite }}-${{ github.sha }}
          path: ${{ runner.temp }}/narration-gameplay-evidence/
          retention-days: 14
