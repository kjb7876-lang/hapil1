name: Canonical story narration audit
on:
  push:
    branches: [main, 'dot/story-narration-qa-*']
    paths:
      - '.github/workflows/story-narration-audit.yml'
      - 'assets/story-narration/**'
      - 'assets/combat-audio/**'
      - 'assets/index-v31526.js'
      - 'tests/combat-audio*'
      - 'tools/combat-audio-apply.cjs'
      - 'tools/rc130-preservation.cjs'
      - 'tools/story-narration-release73-preservation.cjs'
      - 'tests/rc121-connected-topology-browser.cjs'
      - 'assets/rc51/story.js'
      - 'assets/title/v31236/christian-opening-v31236.js'
      - 'data/story-rc51.js'
      - 'data/rc57/voice-monologue-*.txt'
      - 'tools/replace-narrative-ellipsis.cjs'
      - 'tools/narrative-proofreads.cjs'
      - 'data/rc57/narrative-proofreads-20261002.json'
      - 'tests/story-narration*'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: story-narration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  published-audio:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify exact deployed narration and original audio bytes
        env:
          HAPIL_PUBLIC_URL: https://kjb7876-lang.github.io/hapil1/
          TESTED_COMMIT: ${{ github.sha }}
        run: |
          node tests/story-narration-published.cjs
          node tests/combat-audio-published.cjs
  narration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install media verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Validate canonical source and original voice contracts
        run: |
          node --check assets/combat-audio/v1/catalog.js
          node --check assets/combat-audio/v1/controller.js
          node --check assets/combat-audio/v1/native-bridge.js
          node tests/combat-audio-assets.cjs
          node --test tests/combat-audio-controller.cjs tests/combat-audio-bridge.cjs tests/combat-audio-native-sfx.cjs tests/combat-audio-impact.cjs
          node --check assets/story-narration/v1/player.js
          node --check assets/story-narration/v1/mixer.js
          node --check assets/rc49/story-voice.js
          node --check assets/rc51/story.js
          node --check assets/story-narration/v1/surfaces.js
          node --check assets/title/v31236/christian-opening-v31236.js
          node tests/rc48-story-voice-smoke.cjs
          node tests/rc51-story-and-samong-smoke.cjs
          node tests/rc74-flight-voice-lifecycle.cjs
          node tests/rc75-ending-and-awakening.cjs
          node tests/rc89-narrative-smoke.cjs
          node tests/story-narration-text.cjs
          node tests/story-narration-proofreads.cjs
          node tests/story-narration-manifest.cjs
          node --test tests/story-narration-media-races.cjs tests/story-narration-overlap.cjs tests/story-narration-webaudio-races.cjs tests/story-narration-original-timing.cjs tests/story-narration-mixing.cjs
      - name: Install isolated browser runtime
        run: |
          QA_RUNTIME="$RUNNER_TEMP/story-narration-runtime"
          npm install --prefix "$QA_RUNTIME" --no-save --package-lock=false playwright@1.55.1
          node "$QA_RUNTIME/node_modules/playwright/cli.js" install --with-deps chromium
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$QA_RUNTIME/node_modules" >> "$GITHUB_ENV"
          echo "HAPIL_CHROMIUM=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$QA_RUNTIME/node_modules/playwright")" >> "$GITHUB_ENV"
      - name: Exercise playback and interrupted flows
        env:
          HAPIL_NARRATION_OUTPUT: ${{ runner.temp }}/story-narration-evidence
          HAPIL_COMBAT_AUDIO_OUTPUT: ${{ runner.temp }}/story-narration-evidence/combat-audio
        run: |
          node tests/story-narration-browser.cjs
          node tests/story-narration-surfaces-browser.cjs
          node tests/story-narration-audio-browser.cjs
          node tests/story-narration-webaudio-browser.cjs
          node tests/combat-audio-browser.cjs
          HAPIL_DECODER_EDGE_REPORT="$HAPIL_NARRATION_OUTPUT/decoder-edges.json" node tests/story-narration-decoder-edges.cjs
      - name: Preserve narration layout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: narration-layout-${{ github.sha }}
          path: ${{ runner.temp }}/story-narration-evidence/
          if-no-files-found: warn
          retention-days: 14
  gameplay-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [dream, death-dialog, topology, release]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Fetch approved art reference
        run: git fetch --no-tags --depth=1 origin 19a4c1f92df16559e43ba822ae0f7b8e74a5c47a
      - name: Install isolated Chromium runtime
        run: |
          QA_RUNTIME="$RUNNER_TEMP/rc121-runtime"
          npm install --prefix "$QA_RUNTIME" --no-save --package-lock=false playwright@1.55.1 > "$RUNNER_TEMP/npm.log" 2>&1
          node "$QA_RUNTIME/node_modules/playwright/cli.js" install --with-deps chromium > "$RUNNER_TEMP/chromium-install.log" 2>&1
          CHROMIUM=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$QA_RUNTIME/node_modules/playwright")
          sudo ln -sf "$CHROMIUM" /usr/bin/chromium
          sudo mkdir -p /workspace/hapil-deliverables/RC119-body
          sudo chown -R "$(id -u):$(id -g)" /workspace/hapil-deliverables
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$QA_RUNTIME/node_modules" >> "$GITHUB_ENV"
          echo "HAPIL_CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
          echo "HAPIL_QA_OUTPUT=$RUNNER_TEMP/narration-gameplay-evidence" >> "$GITHUB_ENV"
          echo "HAPIL_RELEASE_OUTPUT=$RUNNER_TEMP/narration-gameplay-evidence/release" >> "$GITHUB_ENV"
          /usr/bin/chromium --version
      - name: Test exact clean revision
        env:
          SUITE: ${{ matrix.suite }}
          TESTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          test -z "$(git status --porcelain)"
          echo "RC121_TESTED_COMMIT=$TESTED_COMMIT suite=$SUITE"
          mkdir -p "$HAPIL_QA_OUTPUT"
          printf '%s\n' "$TESTED_COMMIT" > "$HAPIL_QA_OUTPUT/tested-commit.txt"
          case "$SUITE" in
            dream) node tests/rc121-dream-regression-browser.cjs ;;
            death-dialog) node tests/rc91-samong-and-laser-smoke.cjs && node tests/dream-death-dialog-browser.cjs ;;
            topology) node tests/rc121-connected-topology-browser.cjs ;;
            release) node tests/laser-release-gate.cjs ;;
          esac
      - name: Print concise evidence
        if: always()
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),root=process.env.HAPIL_QA_OUTPUT||'';
          for(const f of ['dream-results.json','death-dialog-results.json','summary.json','release/release-summary.json']){const p=path.join(root,f);if(!fs.existsSync(p))continue;const x=JSON.parse(fs.readFileSync(p));if(x.natural)for(const r of x.natural){delete r.samples;if(r.frames)r.frames={n:r.frames.n,maxGap:r.frames.maxGap,longTasks:r.frames.longTasks?.length};}if(Array.isArray(x))for(const r of x){r.checks=r.rows?.length;delete r.rows;delete r.renderRows;}console.log('RC121_EVIDENCE '+f+' '+JSON.stringify(x).slice(0,35000));}
          for(const sub of ['natural-story','laser-telegraph']){for(const file of ['stdout.log','stderr.log']){const p=path.join(root,'release',sub,file);if(fs.existsSync(p))console.log('RC121_DETAILS '+sub+'/'+file+'\n'+fs.readFileSync(p,'utf8').slice(0,18000));}}
          NODE
          if [ -d /workspace/hapil-deliverables/RC119-body ]; then mkdir -p "$RUNNER_TEMP/narration-gameplay-evidence/approved-art"; cp -n /workspace/hapil-deliverables/RC119-body/*.png "$RUNNER_TEMP/narration-gameplay-evidence/approved-art/" 2>/dev/null || true; fi
      - name: Preserve exact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: narration-gameplay-${{ matrix.suite }}-${{ github.sha }}
          path: ${{ runner.temp }}/narration-gameplay-evidence/
          retention-days: 14
