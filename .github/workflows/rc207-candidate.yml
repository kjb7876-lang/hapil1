name: RC207 read-only candidate regression
on:
  push:
    branches: [codex/rc207-persona-warning-scatter, codex/rc210-fragment-standing-combat, codex/hapil-combat-shooter-20261018, codex/rc228-review-fixes-20261018]
    paths: ['assets/**', 'audio/**', 'data/**', 'index.html', 'tests/**', 'tools/**', 'qa/**', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: rc207-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install parser and pixel decoder for unmodified native extraction tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --prefix "$RUNNER_TEMP/rc207" --no-save --package-lock=false acorn@8.15.0
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$RUNNER_TEMP/rc207/node_modules" >> "$GITHUB_ENV"
          echo "RC132_MODULES=$RUNNER_TEMP/rc207/node_modules" >> "$GITHUB_ENV"
      - name: Exact approved shooting and floor CPU regression
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HAPIL_QA_OUTPUT: ${{ runner.temp }}/rc227-cpu
          HAPIL_FLOOR_BENCH: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          export NODE_PATH="$CODEX_PRIMARY_RUNTIME_NODE_MODULES"
          mkdir -p "$HAPIL_QA_OUTPUT"
          node tools/rc228-build-extension.cjs --check
          node tools/rc215-build-native.cjs --check
          node tests/rc225-shooter-unit.cjs
          node tests/rc226-shooting-unit.cjs
          node tests/rc227-floor-unit.cjs
          node tests/rc223-feedback-owner-unit.cjs
          node tests/rc195-blink-arena-unit.cjs
          node tests/rc224-arena-regression-unit.cjs
          node tests/rc79-combat-presentation.cjs
          node tests/rc154-cosmic-loader-unit.cjs
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc227-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/rc227-cpu/
          if-no-files-found: error
          retention-days: 14
      - name: Exact candidate and complete CPU regression
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          node tools/rc207-cpu-audit.cjs
          node tests/rc220-combat-unit.cjs
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc207-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/rc207-cpu/
          if-no-files-found: error
          retention-days: 14
  legacy-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [rc130, hero-images]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Normal Chrome Stable validation runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --prefix "$RUNNER_TEMP/rc207" --no-save --package-lock=false playwright@1.55.1 acorn@8.15.0
          node "$RUNNER_TEMP/rc207/node_modules/playwright/cli.js" install --with-deps chrome
          CHROME="$(command -v google-chrome)"
          test -x "$CHROME"
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$RUNNER_TEMP/rc207/node_modules" >> "$GITHUB_ENV"
          echo "RC132_MODULES=$RUNNER_TEMP/rc207/node_modules" >> "$GITHUB_ENV"
          echo "HAPIL_CHROMIUM=$CHROME" >> "$GITHUB_ENV"
          echo "HAPIL_QA_OUTPUT=$RUNNER_TEMP/rc207-legacy" >> "$GITHUB_ENV"
          echo "HAPIL_RELEASE_OUTPUT=$RUNNER_TEMP/rc207-legacy" >> "$GITHUB_ENV"
      - name: Verify unchanged sandbox and exact candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          node tests/chromium-sandbox-policy.cjs
          node tests/rc153-chrome-sandbox-smoke.cjs
      - name: Compare legacy danmaku failure with pinned published main
        if: matrix.suite == 'rc130'
        env:
          BASELINE_SHA: b0b919d4e18c2e93f871606ece0744d077ff7239
        run: |
          set -euo pipefail
          BASELINE_DIR="$RUNNER_TEMP/rc227-main-baseline"
          BASELINE_OUT="$HAPIL_QA_OUTPUT/published-main-rc129"
          mkdir -p "$BASELINE_OUT"
          git worktree add --detach "$BASELINE_DIR" "$BASELINE_SHA"
          set +e
          (cd "$BASELINE_DIR" && EXPECTED_SHA="$BASELINE_SHA" HAPIL_QA_OUTPUT="$BASELINE_OUT" node tests/rc129-browser.cjs) > "$BASELINE_OUT/execution.log" 2>&1
          BASELINE_EXIT=$?
          set -e
          printf '{"sha":"%s","exitCode":%s,"scope":"same sandbox-enabled CI Chrome, pinned published main"}\n' "$BASELINE_SHA" "$BASELINE_EXIT" > "$BASELINE_OUT/baseline-exit.json"
          cat "$BASELINE_OUT/baseline-exit.json"
          tail -n 30 "$BASELINE_OUT/execution.log"
          HAPIL_APP_ROOT="$BASELINE_DIR" HAPIL_APP_SHA="$BASELINE_SHA" HAPIL_ONLY_BASELINE=1 HAPIL_QA_OUTPUT="$HAPIL_QA_OUTPUT/published-main-performance" node tests/rc225-combat-browser.cjs
          git worktree remove "$BASELINE_DIR"
      - name: Audit only without transformers or Git writes
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          case "$SUITE" in
            rc130) node tests/rc130-suite.cjs ;;
            hero-images)
              node tests/rc131-hero-unit.cjs
              node tests/rc131-hero-images.cjs
              node tests/rc115-hero-directions-browser.cjs
              node tests/rc93-hero-actions-browser.cjs
              node tests/rc132-unit.cjs
              node tests/rc132-browser.cjs
              ;;
          esac
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc207-legacy-${{ matrix.suite }}-${{ github.sha }}
          path: ${{ runner.temp }}/rc207-legacy/
          if-no-files-found: error
          retention-days: 14
  rc210-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install existing normal Chrome Stable validation runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/rc210" --no-save --package-lock=false playwright@1.55.1
          node "$RUNNER_TEMP/rc210/node_modules/playwright/cli.js" install --with-deps chrome
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$RUNNER_TEMP/rc210/node_modules" >> "$GITHUB_ENV"
      - name: Capture exact candidate native fixtures
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HAPIL_QA_OUTPUT: ${{ runner.temp }}/rc210-evidence
        run: |
          set -euo pipefail
          node tests/chromium-sandbox-policy.cjs
          node tests/rc153-chrome-sandbox-smoke.cjs
          node tests/rc210-browser.cjs
          HAPIL_QA_OUTPUT="$HAPIL_QA_OUTPUT/persona-native" node tests/rc158-native-browser.cjs
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc210-native-fixtures-${{ github.sha }}
          path: ${{ runner.temp }}/rc210-evidence/
          if-no-files-found: error
          retention-days: 14
  rc227-combat-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Use runner Chrome Stable with unchanged sandbox
        run: |
          command -v google-chrome
          google-chrome --version
          npm install --prefix "$RUNNER_TEMP/rc227" --no-save --package-lock=false playwright@1.55.1
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$RUNNER_TEMP/rc227/node_modules" >> "$GITHUB_ENV"
      - name: Verify exact shooting and movement candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HAPIL_QA_OUTPUT: ${{ runner.temp }}/rc227-browser
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          node tests/chromium-sandbox-policy.cjs
          node tests/rc153-chrome-sandbox-smoke.cjs
          node tests/rc225-combat-browser.cjs
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc227-combat-browser-${{ github.sha }}
          path: ${{ runner.temp }}/rc227-browser/
          if-no-files-found: error
          retention-days: 14
