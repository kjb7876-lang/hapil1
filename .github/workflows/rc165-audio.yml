name: RC165 narrow audio validation
on:
  push:
    branches: [codex/rc165-audio-bgm-mute]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install normal Chrome Stable validation runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/rc165" --no-save --package-lock=false playwright@1.55.1 acorn@8.15.0
          node "$RUNNER_TEMP/rc165/node_modules/playwright/cli.js" install --with-deps chrome
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$RUNNER_TEMP/rc165/node_modules" >> "$GITHUB_ENV"
      - name: Validate exact SHA and preservation
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          node tests/combat-audio-controller.cjs
          node tests/combat-audio-native-sfx.cjs
          node tests/combat-audio-impact.cjs
          node tests/rc154-cosmic-loader-unit.cjs
          node tests/rc156-anatomy-preservation-unit.cjs
          node tests/rc142-gameplay-unit.cjs
          node tests/rc133-preservation-unit.cjs
      - name: Real media narrow audio paths
        run: |
          node tests/rc165-audio-browser.cjs --baseline-mute
          node tests/rc165-audio-browser.cjs
          test -z "$(git status --porcelain)"
