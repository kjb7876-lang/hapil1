name: RC121 source inspection
on:
  workflow_dispatch:
  push:
    branches: [fix/rc121-connected-dream]
    paths: ['.github/workflows/rc121-source-locations.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Print exact call-site context
        run: |
          node <<'NODE'
          const fs=require('fs'),f='assets/index-v31526.js',lines=fs.readFileSync(f,'utf8').split('\n');
          console.log('RELATED_TESTS',fs.readdirSync('tests').filter(x=>/dream|samong|topology|laser|mode/i.test(x)).join(' '));
          let count=0,chars=0;for(let i=0;i<lines.length;i++)if(/__HAPIL_CHOICE_RC97__|__HAPIL_LASER_TOPOLOGY_RC108__|__HAPIL_SAMONG_RICOCHET_RC108__|dreamMirrorLasersV31347|bossFinaleV31334/.test(lines[i])&&count++<90){const section=lines.slice(Math.max(0,i-6),i+12).map((x,k)=>`${Math.max(0,i-6)+k+1}: ${x.slice(0,1400)}`).join('\n');if(chars+section.length>100000)break;chars+=section.length;console.log('\nSOURCE '+f+'\n'+section);}
          NODE
