name: RC121 source inspection
on:
  workflow_dispatch:
  push:
    branches: [fix/rc121-connected-dream]
    paths: ['.github/workflows/rc121-source-locations.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Read the exact death-dialog implementation
        run: |
          node <<'NODE'
          const fs=require('fs'),p='assets/index-v31526.js',l=fs.readFileSync(p,'utf8').split('\n');
          for(let i=0;i<l.length;i++)if(/function HAPIL_showDeathVerseRC59|function HAPIL_episode1DeathDestinationRC59/.test(l[i]))console.log('SOURCE '+p+'\n'+l.slice(Math.max(0,i-15),i+150).map((x,k)=>(Math.max(0,i-15)+k+1)+': '+x).join('\n'));
          NODE
