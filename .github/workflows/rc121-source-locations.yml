name: RC121 source inspection
on:
  workflow_dispatch:
  push:
    branches: [fix/rc121-connected-dream]
    paths: ['.github/workflows/rc121-source-locations.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Print Dream revival and terminal-state context
        run: |
          node <<'NODE'
          const fs=require('fs'),f='assets/index-v31526.js',lines=fs.readFileSync(f,'utf8').split('\n');
          const ranges=[];for(let i=0;i<lines.length;i++)if(/__HAPIL_SAMONG_RC91__|samongPassiveRC91|tryRevive|o\.hp\s*<=\s*0/.test(lines[i]))ranges.push([Math.max(0,i-18),Math.min(lines.length,i+28)]);
          ranges.sort((a,b)=>a[0]-b[0]);const merged=[];for(const r of ranges){if(merged.length&&r[0]<=merged.at(-1)[1])merged.at(-1)[1]=Math.max(merged.at(-1)[1],r[1]);else merged.push(r);}
          let chars=0;for(const [a,b]of merged){const s=lines.slice(a,b).map((x,k)=>`${a+k+1}: ${x.slice(0,2800)}`).join('\n');if(chars+s.length>180000)break;chars+=s.length;console.log('\nSOURCE '+f+'\n'+s);}
          NODE
