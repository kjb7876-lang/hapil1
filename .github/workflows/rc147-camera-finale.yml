name: RC147 camera and finale exact candidate
on:
  push:
    branches: [main, codex/rc161-persona-clarity, codex/rc162-persona-feedback-priority, codex/rc163-ego-mobile-victory, codex/rc152-image-combat, codex/rc147-camera-persona-finale, codex/rc150-mobile-sequential-cosmic, codex/rc169-final-runtime-regression, codex/rc207-persona-warning-scatter, codex/rc210-fragment-standing-combat, codex/rc231-all-combat-persona-20261026, codex/rc233-persona-combat-quality-20261026]
    paths:
      - 'assets/rc210/**'
      - 'tests/rc210-*'
      - 'qa/rc210/**'
      - '.github/workflows/**'
      - 'qa/rc207/**'
      - 'tests/rc207-*'
      - 'tests/rc158-*.cjs'
      - 'tests/rc161-*.cjs'
      - 'tests/rc162-*.cjs'
      - 'tests/rc163-*.cjs'
      - 'assets/**'
      - 'index.html'
      - 'qa/rc133/**'
      - 'qa/rc130/public-smoke.cjs'
      - 'tools/rc133-*.cjs'
      - 'tests/rc147-*.cjs'
      - 'tests/rc148-*.cjs'
      - 'tests/rc86-samong-cosmic-*.cjs'
      - 'tests/rc88-danmaku-rpg-*.cjs'
      - 'tests/rc108-combat-browser.cjs'
      - 'tests/rc115-natural-story-portal-browser.cjs'
      - 'tests/rc116-laser-*-browser.cjs'
      - 'tests/rc118-laser-phase-browser.cjs'
      - 'tests/rc119-laser-body-browser.cjs'
      - 'tests/rc122-autoplay-browser.cjs'
      - 'tests/rc123-boundary-browser.cjs'
      - 'tests/rc125-*-browser.cjs'
      - 'tests/rc126-combat-browser.cjs'
      - 'tests/rc127-browser.cjs'
      - 'tests/rc128-browser.cjs'
      - 'tests/rc129-browser.cjs'
      - 'tests/rc153-chrome-sandbox-smoke.cjs'
      - 'tests/chromium-sandbox-policy.cjs'
      - 'tests/story-narration-decoder-edges.cjs'
      - 'tests/fixtures/story-narration-chrome-stable-v154.json'
      - 'tests/rc142-persona-volley-browser.cjs'
      - 'tests/rc142-gameplay-unit.cjs'
      - 'tests/rc134-persona-effects-browser.cjs'
      - 'tests/rc150-*.cjs'
      - 'tests/rc154-cosmic-loader-unit.cjs'
      - 'tests/rc155-*.cjs'
      - 'tests/rc156-*.cjs'
      - 'qa/rc156/**'
      - 'tests/rc133-published-url.cjs'
      - 'tests/rc133-preservation-unit.cjs'
      - 'qa/rc133/published.cjs'
      - 'qa/rc148/**'
      - '.github/workflows/rc147-camera-finale.yml'
      - '.github/workflows/rc137-integration.yml'
      - '.github/workflows/story-narration-audit.yml'
      - 'tests/rc231*'
      - 'tests/rc232*'
      - 'tests/rc233*'
      - 'tools/rc233-build-extension.cjs'
      - 'tests/helpers/landscape-orientation.cjs'
      - 'tools/rc232-build-extension.cjs'
      - 'tests/helpers/rc231-orientation-snapshot.cjs'
      - 'qa/rc132/published.cjs'
      - 'tests/rc133-public-contract.cjs'
      - 'tests/rc137-death-choice-browser.cjs'
      - 'tests/rc137-boss-lifecycle-browser.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc147-camera-finale-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [pc, portrait, landscape]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare Playwright runtime
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/rc147-runtime"
          npm install --prefix "$R" --no-save --package-lock=false playwright@1.55.1 acorn@8.15.0
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi
          sudo apt-get install -y ffmpeg
          mkdir -p "$HOME/.cache/ms-playwright/ffmpeg-1011"
          ln -sfn "$(command -v ffmpeg)" "$HOME/.cache/ms-playwright/ffmpeg-1011/ffmpeg-linux"
          test -x "$HOME/.cache/ms-playwright/ffmpeg-1011/ffmpeg-linux"
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$R/node_modules" >> "$GITHUB_ENV"
          echo "RC132_MODULES=$R/node_modules" >> "$GITHUB_ENV"
      - name: Verify exact gameplay and screens
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RC147_PROFILE: ${{ matrix.profile }}
          RC142_PROFILE: ${{ matrix.profile }}
          RC148_PROFILE: ${{ matrix.profile }}
          RC148_SEED: '132148'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          node tests/chromium-sandbox-policy.cjs
          command -v google-chrome
          google-chrome --version
          node tests/rc153-chrome-sandbox-smoke.cjs
          node --check assets/index-v31526.js
          node --check assets/hapil-mobile-v31406.js
          node --check assets/rc86/samong-cosmic.js
          node --check assets/rc88/danmaku-rpg.js
          node --check qa/rc130/public-smoke.cjs
          node tests/rc133-published-url.cjs
          node tests/rc156-camera-capture-unit.cjs
          if test "$RC147_PROFILE" = portrait; then
            HAPIL_QA_OUTPUT="$RUNNER_TEMP/rc218-orientation" node tests/rc142-persona-volley-browser.cjs
            test -z "$(git status --porcelain)"
            exit 0
          fi
          if test "$RC147_PROFILE" = pc; then
            node tests/rc203-native-barrage-unit.cjs
            node tests/rc210-ornaments-unit.cjs
            node tests/rc210-standing-unit.cjs
            node tests/rc210-memory-film-unit.cjs
            HAPIL_QA_OUTPUT="$RUNNER_TEMP/rc210-images-and-boss" EXPECTED_SHA="$EXPECTED_SHA" node tests/rc210-browser.cjs
          fi
          HAPIL_QA_OUTPUT="$RUNNER_TEMP/rc219-fall" node tests/rc210-fall-progression-browser.cjs
          HAPIL_QA_OUTPUT="$RUNNER_TEMP/rc147-camera" node tests/rc147-camera-finale-browser.cjs
          HAPIL_QA_OUTPUT="$RUNNER_TEMP/rc147-persona" node tests/rc142-persona-volley-browser.cjs
          HAPIL_QA_OUTPUT="$RUNNER_TEMP/rc148-six-cosmic" node tests/rc148-six-cosmic-perf-browser.cjs
          if test "$RC147_PROFILE" = pc; then
            node tests/rc150-awakening-impact.cjs
            node tests/rc133-feedback-unit.cjs
            HAPIL_QA_OUTPUT="$RUNNER_TEMP/rc150-live" node tests/rc150-live-browser.cjs
            node tests/rc142-gameplay-unit.cjs
            HAPIL_QA_OUTPUT="$RUNNER_TEMP/rc147-auto" node tests/rc147-auto-defense-browser.cjs
            node tests/rc86-samong-cosmic-smoke.cjs
            node tests/rc86-samong-cosmic-browser.cjs
            node tests/rc88-danmaku-rpg-smoke.cjs
            node tests/rc88-danmaku-rpg-browser.cjs
            node tests/rc75-ending-and-awakening.cjs
            node tests/rc133-preservation-unit.cjs
            node tests/rc154-cosmic-loader-unit.cjs
            node tests/rc155-ego-guardian-unit.cjs
            node tests/rc155-ego-art-unit.cjs
            node tests/rc155-combat-quality-unit.cjs
            HAPIL_QA_OUTPUT="$RUNNER_TEMP/rc147-legacy" node tests/rc128-candidate.cjs
          fi
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc147-${{ github.sha }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/rc147-*/
          retention-days: 14
