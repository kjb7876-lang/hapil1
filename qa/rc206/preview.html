<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="../../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RC206 검사 공격 후보 검토</title><style>body{margin:0;background:#10131b;color:#eee;font:15px system-ui;padding:20px}main{max-width:1100px;margin:auto}canvas{width:100%;height:auto;background:#151820;border:1px solid #454858}button,select,input{margin:8px;padding:7px}small{color:#bbc1cf}</style></head><body><main><h1>검사 공격 · 8방향 후보</h1><p>고정된 몸과 단일 검 텍스처를 사용하는 검토용 화면입니다. 실제 전투·피격 검사는 포함하지 않습니다.</p><button id="play">재생 / 정지</button><select id="dir"><option value="n">후면</option><option value="ne">우상</option><option value="e">오른쪽</option><option value="se">우하</option><option value="s">전면</option><option value="sw">좌하</option><option value="w">왼쪽</option><option value="nw">좌상</option></select><input id="time" type="range" min="0" max="1" step=".001" value="0"><span id="stage"></span><canvas id="canvas" width="1920" height="1080"></canvas><p><small>이미지가 로딩된 후 조작할 수 있습니다. 이 페이지의 동작은 기록된 브라우저 검증 결과가 아닙니다.</small></p></main><script src="assets/rc206/slayer-rig.js?v=20601"></script><script>
const R=window.__HAPIL_SLAYER_RIG_RC204__,canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),slider=document.querySelector('#time'),direction=document.querySelector('#dir'),cache={};let playing=false,last=0;Promise.all(R.assets.map(path=>new Promise((resolve,reject)=>{const im=new Image();cache[path]=im;im.onload=resolve;im.onerror=reject;im.src=path;}))).then(()=>{function paint(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#151820';ctx.fillRect(0,0,1920,1080);ctx.scale(9.4,9.4);const p=Number(slider.value);R.draw(ctx,cache,0,0,66,{}, {hero:'slayer',kind:'attack',dir:direction.value,rigidSector:direction.value,rigidProgress:p},(_,path)=>cache[path],()=>({x:960/9.4,y:1000/9.4}));document.querySelector('#stage').textContent=p<.3?'준비':p<.64?'휘두름':'회복';}slider.oninput=paint;direction.onchange=paint;document.querySelector('#play').onclick=()=>playing=!playing;function tick(t){if(playing)slider.value=(Number(slider.value)+Math.min(.05,(t-last)/1000)/1.4)%1;last=t;paint();requestAnimationFrame(tick);}requestAnimationFrame(tick);}).catch(()=>document.querySelector('#stage').textContent='이미지 로딩 실패');
</script></body></html>
